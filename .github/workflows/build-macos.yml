name: Build and release macOS

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build universal macOS app
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.5'

      - name: Test build and packaging
        run: python3 -B -m unittest discover -s tests -v

      - name: Build and package OctoCmd.app
        run: ./build_and_export.sh

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octocmd-macos-universal
          path: |
            export/*.zip
            export/*.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: octocmd-macos-universal
          path: export

      - name: Verify release checksums
        working-directory: export
        run: sha256sum --check ./*.sha256

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Universal macOS build for Apple Silicon and Intel, requiring macOS 13.1 or newer.

          **Preview distribution:** this app is ad-hoc signed, not Developer ID signed or notarized. macOS may block first launch. See the README for installation and permission instructions.

          Download the ZIP and its `.sha256` file together, then verify with `shasum -a 256 -c OctoCmd-*-macos-universal.zip.sha256` before extracting.
          EOF
          gh release create "$RELEASE_TAG" export/*.zip export/*.sha256 \
            --verify-tag \
            --title "OctoCmd $RELEASE_TAG" \
            --generate-notes \
            --notes-file release-notes.md
